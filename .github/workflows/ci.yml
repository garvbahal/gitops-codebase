name: CI Codebase Pipeline

on:
  push:
    branches:
      - main

jobs:
  push-to-docker-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v2

      - name: Docker login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/gitops-codebase:${{ github.sha }}

  push-to-ops-repo:
    runs-on: ubuntu-latest
    needs: push-to-docker-registry
    steps:
      - name: Checkout ops repo
        uses: actions/checkout@v2
        with:
          repository: garvbahal/gitops-ops
          token: ${{ secrets.OPS_REPO_TOKEN }}
          ref: main
          path: ops

      - name: Update image tag in kustomize overlay
        working-directory: ops
        run: |
          sed -i "s/newTag: .*/newTag: ${{github.sha}}/" kubernetes/overlays/main/kustomization.yaml

      - name: Commit and push ops changes
        working-directory: ops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kubernetes/overlays/main/kustomization.yml
          if git diff --cached --quiet; then
            echo "No manifest change to commit."
          else
            git commit -m "deploy: update backend image to ${{ github.sha }}"
            git push origin main
          fi
